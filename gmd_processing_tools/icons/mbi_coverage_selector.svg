<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- MBI Barangay Selector: MBI area (orange) matched to selectable barangay coverage (blue / teal shades) -->
  <!-- Background: MBI discrepancy zone -->
  <path d="M2 5 L11 3 L12 11 L3 12 Z" fill="#ff7f00" fill-opacity="0.5" stroke="#e65100" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Barangay coverage options (selectable, colour-coded) -->
  <path d="M12 3 L22 4 L21 12 L12 11 Z" fill="#80cbc4" stroke="#00695c" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M3 12 L12 11 L13 20 L4 21 Z" fill="#90caf9" stroke="#1565c0" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M12 11 L21 12 L20 20 L13 20 Z" fill="#ffe082" stroke="#ff8f00" stroke-width="1.0" stroke-linejoin="round"/>
  <!-- "B" marker for barangay, plus a selection checkmark -->
  <text x="5" y="10" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#bf360c">B</text>
  <path d="M14 15 L16 17 L20 13" fill="none" stroke="#0d47a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
